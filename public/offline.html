<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Readfox — Offline Reader</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3eee3;
        --card: #fbf8f1;
        --fg: #1f1b16;
        --muted: #6b6358;
        --border: rgba(31, 27, 22, 0.12);
        --primary: #2d6a4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17140f;
          --card: #211d17;
          --fg: #f3eee3;
          --muted: #a69c8e;
          --border: rgba(243, 238, 227, 0.14);
          --primary: #52b788;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, sans-serif;
        padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
      }
      main {
        max-width: 42rem;
        margin: 24px auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .badge {
        font-size: 12px;
        font-weight: 600;
        color: var(--primary);
      }
      button {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .reader {
        font-family: Georgia, serif;
        font-size: 19px;
        line-height: 1.75;
        white-space: pre-wrap;
      }
      .word {
        background: transparent;
        border: 0;
        padding: 0 2px;
        font: inherit;
        color: inherit;
        border-radius: 4px;
      }
      .word:hover,
      .word.saved {
        background: rgba(45, 106, 79, 0.18);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="badge">Readfox Offline</div>
          <h1 id="heading" style="margin: 4px 0 0; font-size: 22px">Recent lessons</h1>
        </div>
        <button id="retry" type="button">Reconnect</button>
      </header>
      <p id="status" class="muted">You are offline. Showing lessons cached on this device.</p>
      <div id="app"></div>
    </main>
    <script src="/offline-reader.js"></script>
  </body>
</html>
